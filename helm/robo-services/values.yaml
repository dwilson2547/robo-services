image:
  repository: dwilson2547/kreceiver-proto
  pullPolicy: IfNotPresent
  tag: 20260620-proto-v2

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: robo-services

receiver:
  enabled: false
  name: kreceiver
  replicaCount: 1

podAnnotations: {}
podLabels: {}

service:
  type: LoadBalancer
  port: 5514
  targetPort: 5514
  protocol: UDP
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.0.70

config:
  bindHost: 0.0.0.0
  bindPort: 5514
  iggyStream: can-pub-sub-probe
  diagnosticsTopic: telemetry.diagnostics.ingest
  gpsTopic: telemetry.raw.gps
  imuTopic: telemetry.raw.imu
  rtkTopic: telemetry.raw.rtk
  canTopic: telemetry.raw.can
  transport: both
  mqttHost: mosquitto.pub-sub.svc.cluster.local
  mqttPort: "1883"
  mqttTopic: telemetry/ingest
  registryUrl: "http://robo-registry.robo-services.svc.cluster.local"

mosquitto:
  enabled: false
  name: mosquitto
  image:
    repository: eclipse-mosquitto
    tag: "2"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 1883
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.0.71
  resources: {}

# Validates authentik access tokens for the pub-sub mosquitto's public 8883
# listener (infra/cluster-config/pub-sub); mosquitto-go-auth calls it at
# mqtt-auth.robo-services.svc.cluster.local:8080. Provider:
# infra/cluster-config/authentik/blueprints/phone-gateway.yaml.
mqttAuth:
  enabled: true
  name: mqtt-auth
  replicaCount: 1
  image:
    repository: dwilson2547/robo-services-mqtt-auth
    pullPolicy: IfNotPresent
    tag: 20261103-v2
  port: 8080
  ingestTopic: telemetry/ingest
  authentik:
    issuer: "https://auth.danwils.com/application/o/phone-gateway/"
    # Keys from authentik's in-cluster service, not the public name: Cloudflare
    # answers Python's default user agent with 403. Same keys; the token's iss
    # is still checked against the public issuer above.
    jwksUrl: "http://authentik-server.authentik.svc.cluster.local/application/o/phone-gateway/jwks/"
    audience: phone-gateway
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

# DBC decode of telemetry.raw.can -> telemetry.decoded.can (ids the DBC lacks ->
# unknownTopic). Needs the DBC ConfigMap, created by hand from
# embedded/phone-dbc-repo:
#   kubectl -n robo-services create configmap can-decode-dbc \
#     --from-file=vehicle.dbc=embedded/phone-dbc-repo/dbcs/<vehicle>.dbc \
#     --dry-run=client -o yaml | kubectl apply -f -
# (apply, not create, to update it; Reloader then restarts can-decode)
# Live DBC (2026-11-03): chevy_impala_2008_hscan.dbc at phone-dbc-repo 8f04180.
canDecode:
  enabled: true
  name: can-decode
  replicaCount: 1
  image:
    repository: dwilson2547/robo-services-can-decode
    pullPolicy: IfNotPresent
    tag: 20261103-v2
  inputTopic: telemetry.raw.can
  outputTopic: telemetry.decoded.can
  unknownTopic: telemetry.unknown.can
  # latest: begin after the current tail; earliest: decode everything retained
  start: latest
  dbcConfigMap: can-decode-dbc
  dbcKey: vehicle.dbc
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi

secret:
  create: true
  name: kreceiver-secret
  existingSecret: ""
  iggyConnectionString: iggy+tcp://iggy:replace-me@iggy.pub-sub.svc.cluster.local:8090

archiveWriter:
  enabled: true
  name: parquet-archive-writer
  image:
    repository: dwilson2547/robo-services-archive-writer
    pullPolicy: IfNotPresent
    tag: 20260620-parquet-v3
  topics:
    iggyStream: can-pub-sub-probe
    names:
      - telemetry.raw.gps
      - telemetry.raw.imu
      - telemetry.raw.can
      - telemetry.raw.rtk
  s3:
    endpoint: http://192.168.0.10:30320
    bucket: race-logger
    keyPrefix: raw-telemetry
  batching:
    maxRecordsPerFile: 250
    maxSecondsPerFile: 30
    idleSleepSeconds: "1.0"
  startStrategy: latest
  secret:
    name: race-logger-bucket-credentials
    accessKeyKey: S3_ACCESS_KEY
    secretKeyKey: S3_SECRET_KEY

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

speedJob:
  enabled: true
  name: speed-derivation
  image:
    repository: dwilson2547/robo-services-speed-flink
    pullPolicy: IfNotPresent
    tag: 20261021-speed-v8
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/speed-flink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.speed.SpeedDerivationJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    input: telemetry.raw.gps
    output: telemetry.derived.speed
  window:
    seconds: 10
    maxOutOfOrdernessSeconds: 5
  consumerGroup: speed-derivation
  sourcePollBatchSize: 100
  sinkBatchSize: 100
  sinkFlushIntervalSeconds: 5
  serviceAccount:
    create: true
    name: flink
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

lapJob:
  enabled: true
  name: lap-segmentation
  image:
    repository: dwilson2547/robo-services-lap-flink
    pullPolicy: IfNotPresent
    tag: 20261021-lap-v7
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/lap-flink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.lap.LapSegmentationJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    gpsInput: telemetry.raw.gps
    imuInput: telemetry.raw.imu
    output: telemetry.derived.laps
  consumerGroups:
    gps: lap-segmentation-gps
    imu: lap-segmentation-imu
  sourcePollBatchSize: 100
  # JSON array of device profiles — leave empty to use built-in scraps-v1 defaults.
  # Set to a JSON string (single line) to override. Example:
  # profilesJson: '[{"profile_id":"scraps-v1","device_id_prefix":"SCRAPS",...}]'
  profilesJson: ""
  # When registryUrl is set, profiles are fetched from the registry service and cached with a TTL.
  # Set to the in-cluster registry service URL, e.g. http://robo-registry.robo-services.svc.cluster.local
  # Leave blank to use profilesJson (static) or built-in defaults.
  registryUrl: "http://robo-registry.robo-services.svc.cluster.local"
  profileCacheTtlS: "300"
  serviceAccount:
    create: true
    name: flink-lap
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

trackPositionJob:
  enabled: true
  name: track-position
  image:
    repository: dwilson2547/robo-services-track-position-flink
    pullPolicy: IfNotPresent
    tag: 20261021-track-position-v4
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/track-position-flink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.trackposition.TrackPositionDerivationJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    input: telemetry.raw.gps
    output: telemetry.derived.track_position
  consumerGroup: track-position
  registryUrl: "http://robo-registry.robo-services.svc.cluster.local"
  trackCacheTtlS: 300
  maxMatchDistanceMeters: 75
  sourcePollBatchSize: 100
  serviceAccount:
    create: true
    name: flink-track-position
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

trackPositionTimescaleSinkJob:
  enabled: true
  name: track-position-timescale-sink
  image:
    repository: dwilson2547/robo-services-track-position-timescale-sink
    pullPolicy: IfNotPresent
    tag: 20261021-track-position-timescale-v3
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/track-position-timescale-sink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.trackpositiontimescalesink.TrackPositionTimescaleSinkJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    input: telemetry.derived.track_position
  consumerGroup: track-position-timescale-sink
  sourcePollBatchSize: 100
  timescale:
    host: timescaledb.timescaledb.svc.cluster.local
    port: 5432
    database: postgres
    schema: telemetry
    table: track_position_samples
  secret:
    name: timescaledb-credentials
    userKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
  serviceAccount:
    create: true
    name: flink-track-position-timescale-sink
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

registry:
  enabled: true
  name: robo-registry
  image:
    repository: dwilson2547/robo-services-registry
    pullPolicy: IfNotPresent
    tag: 20260620-analytics-v1
  # Name of a k8s Secret in the robo-services namespace with keys DB_USER and DB_PASSWORD.
  # Create manually:
  #   kubectl create secret generic registry-credentials \
  #     --from-literal=DB_USER=roboservices_dev \
  #     --from-literal=DB_PASSWORD=<password> \
  #     -n robo-services
  secret: registry-credentials
  postgresHost: postgres-dev.postgres.svc.cluster.local
  postgresDb: robo_registry
  timescaleHost: timescaledb.timescaledb.svc.cluster.local
  timescaleDb: postgres
  timescaleSecret: timescaledb-credentials
  resources: {}
  ingress:
    enabled: true
    className: nginx
    host: registry.robo-services.local
    annotations: {}
