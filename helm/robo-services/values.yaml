image:
  repository: dwilson2547/kreceiver-proto
  pullPolicy: IfNotPresent
  tag: 20260526-mqtt-v1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: robo-services

receiver:
  name: kreceiver
  replicaCount: 1

podAnnotations: {}
podLabels: {}

service:
  type: LoadBalancer
  port: 5514
  targetPort: 5514
  protocol: UDP
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.0.70

config:
  bindHost: 0.0.0.0
  bindPort: 5514
  iggyStream: can-pub-sub-probe
  diagnosticsTopic: telemetry.diagnostics.ingest
  gpsTopic: telemetry.raw.gps
  imuTopic: telemetry.raw.imu
  rtkTopic: telemetry.raw.rtk
  canTopic: telemetry.raw.can
  transport: both
  mqttHost: mosquitto.robo-services.svc.cluster.local
  mqttPort: "1883"
  mqttTopic: telemetry/ingest

mosquitto:
  enabled: true
  name: mosquitto
  image:
    repository: eclipse-mosquitto
    tag: "2"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 1883
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.0.71
  resources: {}

secret:
  create: true
  name: kreceiver-secret
  existingSecret: ""
  iggyConnectionString: iggy+tcp://iggy:replace-me@iggy.pub-sub.svc.cluster.local:8090

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

speedJob:
  enabled: true
  name: speed-derivation
  image:
    repository: dwilson2547/robo-services-speed-flink
    pullPolicy: IfNotPresent
    tag: 20260526-speed-v7
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/speed-flink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.speed.SpeedDerivationJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    input: telemetry.raw.gps
    output: telemetry.derived.speed
  window:
    seconds: 10
    maxOutOfOrdernessSeconds: 5
  consumerGroup: speed-derivation
  sourcePollBatchSize: 100
  sinkBatchSize: 100
  sinkFlushIntervalSeconds: 5
  serviceAccount:
    create: true
    name: flink
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

lapJob:
  enabled: true
  name: lap-segmentation
  image:
    repository: dwilson2547/robo-services-lap-flink
    pullPolicy: IfNotPresent
    tag: 20260530-lap-v6
  flinkVersion: v2_0
  mode: native
  job:
    jarURI: local:///opt/flink/usrlib/lap-flink-job.jar
    entryClass: io.github.dwilson2547.roboservices.derivations.lap.LapSegmentationJob
    parallelism: 1
    state: running
    upgradeMode: stateless
    checkpointIntervalMs: 60000
  topics:
    iggyStream: can-pub-sub-probe
    gpsInput: telemetry.raw.gps
    imuInput: telemetry.raw.imu
    output: telemetry.derived.laps
  consumerGroups:
    gps: lap-segmentation-gps
    imu: lap-segmentation-imu
  sourcePollBatchSize: 100
  # JSON array of device profiles — leave empty to use built-in scraps-v1 defaults.
  # Set to a JSON string (single line) to override. Example:
  # profilesJson: '[{"profile_id":"scraps-v1","device_id_prefix":"SCRAPS",...}]'
  profilesJson: ""
  # When registryUrl is set, profiles are fetched from the registry service and cached with a TTL.
  # Set to the in-cluster registry service URL, e.g. http://robo-registry.robo-services.svc.cluster.local
  # Leave blank to use profilesJson (static) or built-in defaults.
  registryUrl: "http://robo-registry.robo-services.svc.cluster.local"
  profileCacheTtlS: "300"
  serviceAccount:
    create: true
    name: flink-lap
  flinkConfiguration:
    classloader.resolve-order: child-first
    taskmanager.numberOfTaskSlots: "1"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m
  taskManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: 1024m

registry:
  enabled: true
  name: robo-registry
  image:
    repository: dwilson2547/robo-services-registry
    pullPolicy: IfNotPresent
    tag: 20260530-registry-v4
  # Name of a k8s Secret in the robo-services namespace with keys DB_USER and DB_PASSWORD.
  # Create manually:
  #   kubectl create secret generic registry-credentials \
  #     --from-literal=DB_USER=roboservices_dev \
  #     --from-literal=DB_PASSWORD=<password> \
  #     -n robo-services
  secret: registry-credentials
  postgresHost: postgres-dev.postgres.svc.cluster.local
  postgresDb: robo_registry
  resources: {}
  ingress:
    enabled: true
    className: nginx
    host: registry.robo-services.local
    annotations: {}
