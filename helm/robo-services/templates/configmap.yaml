apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "robo-services.configMapName" . }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    {{- include "robo-services.receiverLabels" . | nindent 4 }}
data:
  KRECEIVER_BIND_HOST: {{ .Values.config.bindHost | quote }}
  KRECEIVER_BIND_PORT: {{ .Values.config.bindPort | quote }}
  KRECEIVER_IGGY_STREAM: {{ .Values.config.iggyStream | quote }}
  KRECEIVER_DIAGNOSTICS_TOPIC: {{ .Values.config.diagnosticsTopic | quote }}
  KRECEIVER_GPS_TOPIC: {{ .Values.config.gpsTopic | quote }}
  KRECEIVER_IMU_TOPIC: {{ .Values.config.imuTopic | quote }}
  KRECEIVER_RTK_TOPIC: {{ .Values.config.rtkTopic | quote }}
  KRECEIVER_CAN_TOPIC: {{ .Values.config.canTopic | quote }}
  KRECEIVER_TRANSPORT: {{ .Values.config.transport | quote }}
  KRECEIVER_MQTT_HOST: {{ .Values.config.mqttHost | quote }}
  KRECEIVER_MQTT_PORT: {{ .Values.config.mqttPort | quote }}
  KRECEIVER_MQTT_TOPIC: {{ .Values.config.mqttTopic | quote }}
  {{- if .Values.config.registryUrl }}
  KRECEIVER_REGISTRY_URL: {{ .Values.config.registryUrl | quote }}
  {{- end }}
