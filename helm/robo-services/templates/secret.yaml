{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "robo-services.secretName" . }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    {{- include "robo-services.receiverLabels" . | nindent 4 }}
type: Opaque
stringData:
  KRECEIVER_IGGY_CONNECTION_STRING: {{ .Values.secret.iggyConnectionString | quote }}
{{- end }}
