{{- if .Values.mqttAuth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mqttAuth.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    app.kubernetes.io/name: mqtt-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.mqttAuth.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-auth
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-auth
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mqtt-auth
          image: {{ .Values.mqttAuth.image.repository }}:{{ .Values.mqttAuth.image.tag }}
          imagePullPolicy: {{ .Values.mqttAuth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mqttAuth.port }}
              protocol: TCP
          env:
            - name: AUTHENTIK_ISSUER
              value: {{ .Values.mqttAuth.authentik.issuer | quote }}
            - name: AUTHENTIK_JWKS_URL
              value: {{ .Values.mqttAuth.authentik.jwksUrl | quote }}
            - name: AUTHENTIK_AUDIENCE
              value: {{ .Values.mqttAuth.authentik.audience | quote }}
            - name: MQTT_INGEST_TOPIC
              value: {{ .Values.mqttAuth.ingestTopic | quote }}
          resources: {{- toYaml .Values.mqttAuth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mqttAuth.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    app.kubernetes.io/name: mqtt-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: mqtt-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mqttAuth.port }}
      targetPort: {{ .Values.mqttAuth.port }}
      protocol: TCP
{{- end }}
