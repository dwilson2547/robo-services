{{- if .Values.registry.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.registry.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    {{- include "robo-services.registryLabels" . | nindent 4 }}
  {{- with .Values.registry.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.registry.ingress.className }}
  ingressClassName: {{ .Values.registry.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.registry.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.registry.name }}
                port:
                  name: http
{{- end }}
