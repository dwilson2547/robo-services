{{- if .Values.canDiscovery.enabled }}
# DBC discovery for vehicles without a DBC (docs/plans/2026-11-04-dbc-discovery.md §2):
# telemetry.discovery.can + GPS/IMU -> the registry's session_discoveries.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.canDiscovery.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    app.kubernetes.io/name: can-discovery
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # one reader: it keeps open sessions in memory and stores the consumer's offsets
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: can-discovery
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: can-discovery
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: can-discovery
          image: {{ .Values.canDiscovery.image.repository }}:{{ .Values.canDiscovery.image.tag }}
          imagePullPolicy: {{ .Values.canDiscovery.image.pullPolicy }}
          env:
            - name: IGGY_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "robo-services.secretName" . }}
                  key: KRECEIVER_IGGY_CONNECTION_STRING
            - name: IGGY_STREAM
              value: {{ .Values.config.iggyStream | quote }}
            - name: CAN_DISCOVERY_TOPIC
              value: {{ .Values.canDecode.discoveryTopic | quote }}
            - name: MAX_CAN_FRAMES
              value: {{ .Values.canDiscovery.maxCanFrames | int64 | quote }}
            # the registry's database: it owns sessions and session_discoveries
            - name: DB_HOST
              value: {{ .Values.registry.postgresHost | quote }}
            - name: DB_NAME
              value: {{ .Values.registry.postgresDb | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.secret }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.secret }}
                  key: DB_PASSWORD
          resources: {{- toYaml .Values.canDiscovery.resources | nindent 12 }}
{{- end }}
