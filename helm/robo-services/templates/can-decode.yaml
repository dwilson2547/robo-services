{{- if .Values.canDecode.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.canDecode.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    app.kubernetes.io/name: can-decode
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # the DBC is read at start; restart when the hand-made DBC ConfigMap changes
    configmap.reloader.stakater.com/reload: {{ .Values.canDecode.dbcConfigMap | quote }}
spec:
  replicas: 1
  # One partition, held by the first consumer-group member to join: a rolling
  # update would start the new pod while the old one still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: can-decode
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: can-decode
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: can-decode
          image: {{ .Values.canDecode.image.repository }}:{{ .Values.canDecode.image.tag }}
          imagePullPolicy: {{ .Values.canDecode.image.pullPolicy }}
          env:
            {{- include "robo-services.otelEnv" (dict "root" $ "service" "can-decode") | nindent 12 }}
            - name: IGGY_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "robo-services.secretName" . }}
                  key: KRECEIVER_IGGY_CONNECTION_STRING
            - name: IGGY_STREAM
              value: {{ .Values.config.iggyStream | quote }}
            - name: CAN_DECODE_INPUT_TOPIC
              value: {{ .Values.canDecode.inputTopic | quote }}
            - name: CAN_DECODE_OUTPUT_TOPIC
              value: {{ .Values.canDecode.outputTopic | quote }}
            - name: CAN_DECODE_UNKNOWN_TOPIC
              value: {{ .Values.canDecode.unknownTopic | quote }}
            - name: CAN_DECODE_GROUP
              value: {{ .Values.canDecode.consumerGroup | quote }}
            - name: DBC_PATH
              value: /dbcs/{{ .Values.canDecode.dbcKey }}
            - name: CAN_DECODE_DEFAULT_DBC_NAME
              value: {{ .Values.canDecode.defaultDbcName | quote }}
            {{- if .Values.canDecode.perSessionDbcs }}
            # each session decodes with its vehicle's DBC from the registry
            - name: REGISTRY_URL
              value: "http://{{ .Values.registry.name }}.{{ include "robo-services.namespace" . }}.svc.cluster.local"
            {{- end }}
          volumeMounts:
            - name: dbc
              mountPath: /dbcs
              readOnly: true
          resources: {{- toYaml .Values.canDecode.resources | nindent 12 }}
      volumes:
        - name: dbc
          configMap:
            name: {{ .Values.canDecode.dbcConfigMap }}
{{- end }}
