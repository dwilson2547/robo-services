{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.registry.name }}
  namespace: {{ include "robo-services.namespace" . }}
  labels:
    {{- include "robo-services.registryLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "robo-services.registrySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
{{- end }}
