# Copy to a local file, fill in real values, then:
#   kubectl apply -f <your-filled-file>
# Do NOT commit the filled version.
#
# Prerequisites:
#   1. Run cluster_config/postgres/init-roboservices-dev.sql against postgres-dev:
#      psql -h <postgres-dev-host> -U postgres \
#        -v roboservices_dev_password='your-password' \
#        -f init-roboservices-dev.sql
#
#   2. Apply this secret (namespace must exist first):
#      kubectl apply -f registry-credentials.yml

apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: robo-services
type: Opaque
stringData:
  DB_USER: "roboservices_dev"
  DB_PASSWORD: "CHANGE_ME"
