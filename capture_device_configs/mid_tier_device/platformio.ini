; race_logger — PlatformIO project config
; Target: SparkFun ESP32 Thing Plus (DEV-15663)

[env:esp32thing_plus]
platform  = espressif32
board     = esp32thing_plus
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    sparkfun/SparkFun BNO08x Arduino Library @ ^1.0.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; mpack: drop mpack.h + mpack.c from https://github.com/ludocode/mpack/releases
    ; into src/ — PlatformIO picks them up automatically

board_build.filesystem = spiffs
board_build.partitions = default.csv
