services:
  iggy:
    image: apache/iggy:0.8.0
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD}
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "iggy --transport tcp --tcp-server-address 127.0.0.1:8090 --credentials-username \"$$IGGY_ROOT_USERNAME\" --credentials-password \"$$IGGY_ROOT_PASSWORD\" ping >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - iggy-data:/local_data
    networks:
      - iggy-net

networks:
  iggy-net:
    name: can-pub-sub-probe-iggy

volumes:
  iggy-data:
