[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "track-poly-poc"
version = "0.1.0"
description = "Racetrack geopolygon builder using Overpass API and OSM data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "shapely>=2.0",
]
